
<!DOCTYPE html>
<html lang="en">
<head>
    <title>namoduL 0.2.4</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">

</head>
<body>
    <div id="topbar">
        <div class="menu-item">
            <button id="range-btn" class="nav-btn">3M ▾</button>
            <div class="dropdown">
                <div class="ind-row header">Range</div>
                <div class="ind-row" onclick="setRange('1D')">1D</div>
                <div class="ind-row" onclick="setRange('1W')">1W</div>
                <div class="ind-row" onclick="setRange('1M')">1M</div>
                <div class="ind-row" onclick="setRange('3M')">3M</div>
                <div class="ind-row" onclick="setRange('1Y')">1Y</div>
            </div>
        </div>
        <div class="menu-item">
            <button id="tf-btn" class="nav-btn">m5 ▾</button>
            <div class="dropdown">
                <div class="ind-row header">TF</div>
                <div class="ind-row" data-value="1m">m1</div>
                <div class="ind-row" data-value="5m">m5</div>
                <div class="ind-row" data-value="15m">m15</div>
            </div>
        </div>
        <div class="menu-item">
            <button id="source-btn" class="nav-btn nav-btn-accent">SOURCE</button>
                <div class="dropdown">
                <div class="ind-row" onclick="setDataSource('none')">Clear</div>
                <div class="ind-row" onclick="setDataSource('twelvedata')">Twelve Data API</div>
                <div class="ind-row" onclick="setDataSource('local')">Local JS</div>
            </div>
        </div>
        <div class="menu-item">
            <button id="pair-btn" class="nav-btn">PAIR ▾</button>
            <div id="pair-dropdown" class="dropdown"></div>
        </div>
        <div id="indicator-menu" class="menu-item">
            <button class="nav-btn">INDICATORS ▾</button>
            <div class="dropdown" onclick="event.stopPropagation()">
                <label class="ind-row"><input type="checkbox" data-id="Worktime" onchange="toggleIndicator('Worktime', this.checked)">Worktime</label>
                <label class="ind-row"><input type="checkbox" data-id="BB" onchange="toggleIndicator('BB', this.checked)">Bollinger Bands</label>
                <hr class="menu-divider">
                <label class="ind-row"><input type="checkbox" data-id="MACD" onchange="toggleIndicator('MACD', this.checked)">MACD</label>
                <label class="ind-row"><input type="checkbox" data-id="ATR" onchange="toggleIndicator('ATR', this.checked)">ATR</label>
                <label class="ind-row"><input type="checkbox" data-id="Stochastic" onchange="toggleIndicator('Stochastic', this.checked)">Stochastic</label>
            </div>
        </div>
        <div class="menu-item">
            <button class="nav-btn" onclick="toggleSettings()">STRATEGY ⚙️</button>
        </div>
        <div id="mini-balance-wrap">
            <canvas id="mini-balance-canvas"></canvas>
            <div id="mini-balance-viewport"></div>
        </div>
        <div class="topbar-spacer"></div>
        <button class="nav-btn" onclick="toggleLog()">LOG</button>
    </div>

    <div id="settings-panel">
        <div class="settings-panel-header" data-settings-drag-handle="true">
            <span class="settings-panel-title">Strategy Editor</span>
            <span class="settings-panel-hint">Drag</span>
        </div>
        <div class="settings-section">
            <div class="strategy-actions">
                <label class="strategy-selector" for="strategy-file-select">
                    <span>Strategy</span>
                    <select id="strategy-file-select" class="strategy-select"></select>
                </label>
                <button class="nav-btn strategy-btn" onclick="resetStrategyCode()">Reset</button>
                <button class="nav-btn strategy-btn" onclick="applyStrategyCode()">Apply</button>
            </div>
            <div class="strategy-editor-launchers">
                <button class="nav-btn strategy-btn" type="button" data-editor-toggle="ind" onclick="toggleStrategyEditorWindow('ind')">Indicators</button>
                <button class="nav-btn strategy-btn" type="button" data-editor-toggle="mm" onclick="toggleStrategyEditorWindow('mm')">MM / Hours</button>
                <button class="nav-btn strategy-btn" type="button" data-editor-toggle="code" onclick="toggleStrategyEditorWindow('code')">Code</button>
            </div>
        </div>
    </div>

    <div id="strategy-editor-ind-panel" class="floating-editor-panel">
        <div class="floating-editor-header" data-editor-drag-handle="ind">
            <span class="floating-editor-title">Indicators</span>
        </div>
        <textarea class="code-editor code-editor-split" id="strategy-ind-editor" placeholder="// Indicator settings"></textarea>
    </div>

    <div id="strategy-editor-mm-panel" class="floating-editor-panel">
        <div class="floating-editor-header" data-editor-drag-handle="mm">
            <span class="floating-editor-title">MM / Hours</span>
        </div>
        <textarea class="code-editor code-editor-split" id="strategy-mm-editor" placeholder="// Money management and trading hours"></textarea>
    </div>

    <div id="strategy-editor-code-panel" class="floating-editor-panel">
        <div class="floating-editor-header" data-editor-drag-handle="code">
            <span class="floating-editor-title">Code</span>
        </div>
        <textarea class="code-editor code-editor-main" id="strategy-code-editor" placeholder="// Strategy rules"></textarea>
    </div>

    <div id="panels-container">
        <div id="main-pane" class="pane-wrapper">
            <div class="v-line"></div>
            <div id="chart-main" class="chart-container"></div>
            <div id="main-session-background"></div>
        </div>
    </div>

    <div id="log-panel">
        <div id="log-header" onclick="toggleLog()"></div>
        <div id="log-content"></div>
    </div>
    <script src="./lightweight-charts.standalone.production.js"></script>
    <script src="./ind.js"></script>
    <script src="./ind_sma.js"></script>
    <script src="./ind_bb.js"></script>
    <script src="./ind_macd.js"></script>
    <script src="./ind_stochastic.js"></script>
    <script src="./ind_atr.js"></script>
    <script src="./ind_renderer.js"></script>
    <script src="./prov-twelvedata.js"></script>
    <script src="./prov-local.js?v=20260320b"></script>
    <script src="./strategy-(autorun)-ind.js"></script>
    <script src="./strategy-(autorun)-mm.js"></script>
    <script src="./strategy-(autorun)-code.js"></script>
    <script>
        window.STRATEGY_FILES = [
            { file: 'strategy-(autorun).js', label: 'Autorun' }
        ];
    </script>
    <script src="./main.js"></script>
    <script src="./strategy-core-context.js"></script>
    <script src="./strategy-core-indicators.js"></script>
    <script src="./strategy-core-signals.js"></script>
    <script src="./strategy-core.js"></script>
    <script src="./strategy.js"></script>
    <script src="./strategy-editor.js"></script>
