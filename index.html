
<!DOCTYPE html>
<html lang="en">
<head>
    <title>namoduL 0.3.2</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css?v=20260413g">

</head>
<body>
    <div id="topbar">
        <div class="menu-item">
            <button id="range-btn" class="nav-btn">3M ▾</button>
            <div class="dropdown">
                <div class="ind-row header">Range</div>
                <div class="ind-row" onclick="setRange('1D')">1D</div>
                <div class="ind-row" onclick="setRange('1W')">1W</div>
                <div class="ind-row" onclick="setRange('1M')">1M</div>
                <div class="ind-row" onclick="setRange('3M')">3M</div>
                <div class="ind-row" onclick="setRange('1Y')">1Y</div>
            </div>
        </div>
        <div class="menu-item">
            <button id="tf-btn" class="nav-btn">m5 ▾</button>
            <div class="dropdown">
                <div class="ind-row header">TF</div>
                <div class="ind-row" data-value="1m">m1</div>
                <div class="ind-row" data-value="5m">m5</div>
                <div class="ind-row" data-value="15m">m15</div>
            </div>
        </div>
        <div class="menu-item">
            <button id="source-btn" class="nav-btn nav-btn-accent">SOURCE</button>
                <div class="dropdown">
                <div class="ind-row" onclick="setDataSource('none')">Clear</div>
                <div class="ind-row" onclick="setDataSource('twelvedata')">Twelve Data API</div>
                <div class="ind-row" onclick="setDataSource('local')">Local JS</div>
            </div>
        </div>
        <div class="menu-item">
            <button id="pair-btn" class="nav-btn">PAIR ▾</button>
            <div id="pair-dropdown" class="dropdown"></div>
        </div>
        <div id="indicator-menu" class="menu-item">
            <button class="nav-btn">INDICATORS ▾</button>
            <div class="dropdown" onclick="event.stopPropagation()">
                <label class="ind-row"><input type="checkbox" data-id="Worktime" onchange="toggleIndicator('Worktime', this.checked)">Worktime</label>
                <label class="ind-row"><input type="checkbox" data-id="BB" onchange="toggleIndicator('BB', this.checked)">Bollinger Bands</label>
                <label class="ind-row"><input type="checkbox" data-id="SMA" onchange="toggleIndicator('SMA', this.checked)">SMA</label>
                <hr class="menu-divider">
                <label class="ind-row"><input type="checkbox" data-id="MACD" onchange="toggleIndicator('MACD', this.checked)">MACD</label>
                <label class="ind-row"><input type="checkbox" data-id="ATR" onchange="toggleIndicator('ATR', this.checked)">ATR</label>
                <label class="ind-row"><input type="checkbox" data-id="Stochastic" onchange="toggleIndicator('Stochastic', this.checked)">Stochastic</label>
            </div>
        </div>
        <div class="menu-item">
            <label class="strategy-selector topbar-strategy-selector" for="strategy-file-select">
                <select id="strategy-file-select" class="strategy-select"></select>
            </label>
            <button class="nav-btn strategy-btn" onclick="resetStrategyCode()">Reset</button>
            <button class="nav-btn strategy-btn" onclick="exportStrategyCode()">Export</button>
            <button class="nav-btn strategy-btn" onclick="applyStrategyCode()">Apply</button>
        </div>
        <div class="menu-item">
            <button class="nav-btn">STRATEGY ▾</button>
            <div class="dropdown" onclick="event.stopPropagation()">
                <div class="ind-row header">Editor</div>
                <div class="ind-row" onclick="toggleStrategyEditorWindow('ind')">Indicators</div>
                <div class="ind-row" onclick="toggleStrategyEditorWindow('mm')">MM</div>
                <div class="ind-row" onclick="toggleStrategyEditorWindow('hours')">Hours</div>
                <div class="ind-row" onclick="toggleStrategyEditorWindow('signals')">Signals</div>
                <div class="ind-row" onclick="toggleStrategyEditorWindow('code')">Code</div>
            </div>
        </div>
        <div id="mini-balance-wrap">
            <canvas id="mini-balance-canvas"></canvas>
            <div id="mini-balance-viewport"></div>
        </div>
        <div class="topbar-spacer"></div>
        <button class="nav-btn" onclick="toggleLog()">LOG</button>
    </div>

    <div id="settings-panel">
        <div class="settings-panel-header" data-settings-drag-handle="true">
            <span class="settings-panel-title">Code</span>
            <div class="floating-editor-actions">
                <button class="nav-btn strategy-btn" type="button" onclick="openCodeBuilder()">Builder</button>
                <button class="nav-btn strategy-btn" type="button" onclick="exportStrategyCode()">Export</button>
                <button class="nav-btn strategy-btn" type="button" onclick="applyStrategyCode()">Apply</button>
                <button class="nav-btn strategy-btn" type="button" onclick="toggleStrategyEditorWindow('code')">Close</button>
            </div>
        </div>
        <div class="settings-section">
            <div id="strategy-inline-code-panel" class="strategy-inline-code-panel">
                <textarea class="code-editor code-editor-main strategy-inline-code-editor" id="strategy-code-editor" placeholder="// Strategy logic (ctx)"></textarea>
            </div>
        </div>
    </div>

    <div id="strategy-editor-ind-panel" class="floating-editor-panel">
        <div class="floating-editor-header" data-editor-drag-handle="ind">
            <span class="floating-editor-title">Indicators</span>
            <div class="floating-editor-actions">
                <button class="nav-btn strategy-btn" type="button" onclick="event.stopPropagation(); applyStrategyCode()">Apply</button>
                <button class="nav-btn strategy-btn" type="button" onclick="event.stopPropagation(); toggleStrategyEditorWindow('ind')">Close</button>
            </div>
        </div>
        <textarea class="code-editor code-editor-split" id="strategy-ind-editor" placeholder="// Indicator settings"></textarea>
    </div>

    <div id="strategy-editor-mm-panel" class="floating-editor-panel">
        <div class="floating-editor-header" data-editor-drag-handle="mm">
            <span class="floating-editor-title">MM</span>
            <div class="floating-editor-actions">
                <button class="nav-btn strategy-btn" type="button" onclick="event.stopPropagation(); applyStrategyCode()">Apply</button>
                <button class="nav-btn strategy-btn" type="button" onclick="event.stopPropagation(); toggleStrategyEditorWindow('mm')">Close</button>
            </div>
        </div>
        <textarea class="code-editor code-editor-split" id="strategy-mm-editor" placeholder="// Money management settings"></textarea>
    </div>

    <div id="strategy-editor-hours-panel" class="floating-editor-panel">
        <div class="floating-editor-header" data-editor-drag-handle="hours">
            <span class="floating-editor-title">Hours</span>
            <div class="floating-editor-actions">
                <button class="nav-btn strategy-btn" type="button" onclick="event.stopPropagation(); applyStrategyCode()">Apply</button>
                <button class="nav-btn strategy-btn" type="button" onclick="event.stopPropagation(); toggleStrategyEditorWindow('hours')">Close</button>
            </div>
        </div>
        <textarea class="code-editor code-editor-split" id="strategy-hours-editor" placeholder="// Trading hours settings"></textarea>
    </div>

    <div id="strategy-editor-signals-panel" class="floating-editor-panel">
        <div class="floating-editor-header" data-editor-drag-handle="signals">
            <span class="floating-editor-title">Signals</span>
            <div class="floating-editor-actions">
                <button class="nav-btn strategy-btn" type="button" onclick="event.stopPropagation(); applyStrategyCode()">Apply</button>
                <button class="nav-btn strategy-btn" type="button" onclick="event.stopPropagation(); toggleStrategyEditorWindow('signals')">Close</button>
            </div>
        </div>
        <textarea class="code-editor code-editor-split" id="strategy-signals-editor" placeholder="// Signal pane calculation&#10;// Use i.st(0), i.bb(0), c(0) etc.&#10;// Set: signal = number (-1..1)"></textarea>
    </div>

    <div id="panels-container">
        <div id="main-pane" class="pane-wrapper">
            <div class="v-line"></div>
            <div id="chart-main-label" class="pane-label"></div>
            <div id="chart-main" class="chart-container"></div>
            <div id="main-session-background">
                <div id="main-session-track"></div>
                <div id="main-session-scale"></div>
            </div>
        </div>
    </div>

    <div id="log-panel">
        <div id="log-header" onclick="toggleLog()"></div>
        <div id="log-content"></div>
    </div>
    <script src="./lightweight-charts.standalone.production.js"></script>
    <script src="./ind.js"></script>
    <script src="./ind_sma.js"></script>
    <script src="./ind_bb.js"></script>
    <script src="./ind_macd.js"></script>
    <script src="./ind_stochastic.js"></script>
    <script src="./ind_atr.js"></script>
    <script src="./ind_renderer.js?v=20260413c"></script>
    <script src="./prov-twelvedata.js"></script>
    <script src="./prov-local.js?v=20260320b"></script>
    <script src="./strategy-(autorun).js?v=20260413a"></script>
    <script>
        window.STRATEGY_FILES = [
            { file: 'strategy-(autorun).js', label: 'Autorun' }
        ];
    </script>
    <script src="./main.js?v=20260413c"></script>
    <script src="./strategy-core-context.js"></script>
    <script src="./strategy-core-indicators.js?v=20260413a"></script>
    <script src="./strategy-core-signals.js"></script>
    <script src="./strategy-indicator-signals.js"></script>
    <script src="./strategy-core.js"></script>
    <script src="./strategy.js?v=20260413a"></script>
    <script src="./strategy-editor.js?v=20260413d"></script>
